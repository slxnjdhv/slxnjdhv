<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset=".2" stop-color="#00f5d4"/>
      <stop offset=".5" stop-color="#9b8cff"/>
      <stop offset=".8" stop-color="#f15bb5"/>
      <stop offset="1" stop-color="#f15bb5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".4" stop-color="#9b8cff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#9b8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .run { animation: run 6s ease-in-out infinite; }
    @keyframes run { 0% { transform: translateX(0); opacity: 0; } 10%, 90% { opacity: 1; } 100% { transform: translateX(800px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0" y="11" width="1000" height="2" fill="url(#l)" opacity=".5"/>
  <circle class="run" cx="100" cy="12" r="10" fill="url(#g)"/>
</svg>
