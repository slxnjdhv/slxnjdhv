<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1f4b"/>
      <stop offset="100%" stop-color="#11142f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#9b8cff"/>
      <stop offset="100%" stop-color="#f15bb5"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect x="10"  y="15" width="230" height="140" rx="16"/></clipPath>
    <clipPath id="c2"><rect x="260" y="15" width="230" height="140" rx="16"/></clipPath>
    <clipPath id="c3"><rect x="510" y="15" width="230" height="140" rx="16"/></clipPath>
    <clipPath id="c4"><rect x="760" y="15" width="230" height="140" rx="16"/></clipPath>
  </defs>
  <style>
    .num   { font-weight: 800; font-size: 40px; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #ffffff; }
    .lbl   { font-weight: 600; font-size: 13px; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #b9c0f0; letter-spacing: 2px; }
    .ico   { font-size: 26px; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
             transform-box: fill-box; transform-origin: center; animation: pop 5s ease-in-out infinite; }
    .card  { animation: bob 5s ease-in-out infinite; }
    .shine { animation: shine 5s ease-in-out infinite; }
    .edge  { fill: none; stroke: #2f3570; }
    .glow  { fill: none; stroke: url(#bar); stroke-width: 1.5; animation: edge 5s ease-in-out infinite; }
    @keyframes bob   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes pop   { 0%, 100% { transform: scale(1); } 10% { transform: scale(1.18); } 20% { transform: scale(1); } }
    @keyframes shine { 0% { transform: translateX(0); } 40%, 100% { transform: translateX(480px); } }
    @keyframes edge  { 0%, 100% { opacity: 0; } 10%, 25% { opacity: .9; } 45% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g class="card">
    <rect x="10" y="15" width="230" height="140" rx="16" fill="url(#card)"/>
    <g clip-path="url(#c1)"><rect class="shine" x="-130" y="0" width="90" height="170" fill="url(#shine)" transform="skewX(-15)"/></g>
    <rect class="edge" x="10" y="15" width="230" height="140" rx="16"/>
    <rect class="glow" opacity="0" x="10" y="15" width="230" height="140" rx="16"/>
    <rect x="30" y="15" width="190" height="4" rx="2" fill="url(#bar)"/>
    <text class="ico" x="125" y="58" text-anchor="middle">💡</text>
    <text class="num" x="125" y="108" text-anchor="middle">10</text>
    <text class="lbl" x="125" y="135" text-anchor="middle">PATENTS</text>
  </g>
  <g class="card" style="animation-delay:-1.25s">
    <rect x="260" y="15" width="230" height="140" rx="16" fill="url(#card)"/>
    <g clip-path="url(#c2)"><rect class="shine" x="120" y="0" width="90" height="170" fill="url(#shine)" transform="skewX(-15)" style="animation-delay:1.25s"/></g>
    <rect class="edge" x="260" y="15" width="230" height="140" rx="16"/>
    <rect class="glow" opacity="0" x="260" y="15" width="230" height="140" rx="16" style="animation-delay:1.25s"/>
    <rect x="280" y="15" width="190" height="4" rx="2" fill="url(#bar)"/>
    <text class="ico" x="375" y="58" text-anchor="middle" style="animation-delay:1.25s">📄</text>
    <text class="num" x="375" y="108" text-anchor="middle">10+</text>
    <text class="lbl" x="375" y="135" text-anchor="middle">PUBLICATIONS</text>
  </g>
  <g class="card" style="animation-delay:-2.5s">
    <rect x="510" y="15" width="230" height="140" rx="16" fill="url(#card)"/>
    <g clip-path="url(#c3)"><rect class="shine" x="370" y="0" width="90" height="170" fill="url(#shine)" transform="skewX(-15)" style="animation-delay:2.5s"/></g>
    <rect class="edge" x="510" y="15" width="230" height="140" rx="16"/>
    <rect class="glow" opacity="0" x="510" y="15" width="230" height="140" rx="16" style="animation-delay:2.5s"/>
    <rect x="530" y="15" width="190" height="4" rx="2" fill="url(#bar)"/>
    <text class="ico" x="625" y="58" text-anchor="middle" style="animation-delay:2.5s">🎓</text>
    <text class="num" x="625" y="108" text-anchor="middle">Ph.D.</text>
    <text class="lbl" x="625" y="135" text-anchor="middle">+ POSTDOC IN AI</text>
  </g>
  <g class="card" style="animation-delay:-3.75s">
    <rect x="760" y="15" width="230" height="140" rx="16" fill="url(#card)"/>
    <g clip-path="url(#c4)"><rect class="shine" x="620" y="0" width="90" height="170" fill="url(#shine)" transform="skewX(-15)" style="animation-delay:3.75s"/></g>
    <rect class="edge" x="760" y="15" width="230" height="140" rx="16"/>
    <rect class="glow" opacity="0" x="760" y="15" width="230" height="140" rx="16" style="animation-delay:3.75s"/>
    <rect x="780" y="15" width="190" height="4" rx="2" fill="url(#bar)"/>
    <text class="ico" x="875" y="58" text-anchor="middle" style="animation-delay:3.75s">👥</text>
    <text class="num" x="875" y="108" text-anchor="middle">16</text>
    <text class="lbl" x="875" y="135" text-anchor="middle">AI/ML DEVS LED</text>
  </g>
</svg>
