<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1330"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset=".5" stop-color="#9b8cff"/>
      <stop offset="1" stop-color="#f15bb5"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#00f5d4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .yr   { font-weight: 700; font-size: 14px; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #9aa3d8; letter-spacing: 1px; }
    .deg  { font-weight: 700; font-size: 15px; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #ffffff; }
    .inst { font-weight: 400; font-size: 12.5px; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #9aa3d8; }
    .head { font-weight: 700; font-size: 13px; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #6f78b8; letter-spacing: 3px; }
    .spark { animation: travel 7s linear infinite; }
    .ring  { fill: none; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ring 7s ease-out infinite; opacity: 0; }
    .dot   { transform-box: fill-box; transform-origin: center; animation: beat 7s ease-out infinite; }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(880px); } }
    @keyframes ring   { 0% { transform: scale(1); opacity: .9; } 18% { transform: scale(3.2); opacity: 0; } 100% { opacity: 0; } }
    @keyframes beat   { 0% { transform: scale(1.5); } 10%, 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1000" height="230" rx="18" fill="url(#bg)"/>
  <text class="head" x="500" y="32" text-anchor="middle">ACADEMIC JOURNEY</text>

  <!-- base line (always visible) -->
  <rect x="60" y="99" width="880" height="3" rx="1.5" fill="url(#line)" opacity=".45"/>
  <!-- travelling spark -->
  <circle class="spark" cx="60" cy="100" r="14" fill="url(#spark)"/>

  <!-- milestones: spark passes x=100,300,500,700,900 at 0.32s, 1.91s, 3.5s, 5.09s, 6.68s -->
  <g>
    <circle class="ring" cx="100" cy="100" r="8" stroke="#00f5d4" style="animation-delay:.32s"/>
    <circle class="dot"  cx="100" cy="100" r="8" fill="#00f5d4" style="animation-delay:.32s"/>
    <text class="yr"   x="100" y="76"  text-anchor="middle">2014 – 2018</text>
    <text class="deg"  x="100" y="140" text-anchor="middle">B.E. Computer Engg.</text>
    <text class="inst" x="100" y="160" text-anchor="middle">PCCOE, Pune</text>
  </g>
  <g>
    <circle class="ring" cx="300" cy="100" r="8" stroke="#4fd3e0" style="animation-delay:1.91s"/>
    <circle class="dot"  cx="300" cy="100" r="8" fill="#4fd3e0" style="animation-delay:1.91s"/>
    <text class="yr"   x="300" y="76"  text-anchor="middle">2018 – 2020</text>
    <text class="deg"  x="300" y="140" text-anchor="middle">M.Tech Cyber Security</text>
    <text class="inst" x="300" y="160" text-anchor="middle">MIT World Peace University</text>
  </g>
  <g>
    <circle class="ring" cx="500" cy="100" r="8" stroke="#9b8cff" style="animation-delay:3.5s"/>
    <circle class="dot"  cx="500" cy="100" r="8" fill="#9b8cff" style="animation-delay:3.5s"/>
    <text class="yr"   x="500" y="76"  text-anchor="middle">2020 – 2022</text>
    <text class="deg"  x="500" y="140" text-anchor="middle">MBA IT Management</text>
    <text class="inst" x="500" y="160" text-anchor="middle">DPU, Pune</text>
  </g>
  <g>
    <circle class="ring" cx="700" cy="100" r="8" stroke="#c77ae0" style="animation-delay:5.09s"/>
    <circle class="dot"  cx="700" cy="100" r="8" fill="#c77ae0" style="animation-delay:5.09s"/>
    <text class="yr"   x="700" y="76"  text-anchor="middle">2020 – 2024</text>
    <text class="deg"  x="700" y="140" text-anchor="middle">Ph.D. Artificial Intelligence</text>
    <text class="inst" x="700" y="160" text-anchor="middle">D Y Patil Intl. University</text>
    <text class="inst" x="700" y="178" text-anchor="middle" style="fill:#6f78b8; font-style:italic">Medical Text Sentiment</text>
  </g>
  <g>
    <circle class="ring" cx="900" cy="100" r="8" stroke="#f15bb5" style="animation-delay:6.68s"/>
    <circle class="dot"  cx="900" cy="100" r="8" fill="#f15bb5" style="animation-delay:6.68s"/>
    <text class="yr"   x="900" y="76"  text-anchor="middle">2024 – 2025</text>
    <text class="deg"  x="900" y="140" text-anchor="middle">Postdoc in AI</text>
    <text class="inst" x="900" y="160" text-anchor="middle">Lincoln University College</text>
    <text class="inst" x="900" y="178" text-anchor="middle" style="fill:#6f78b8; font-style:italic">Neural Nets for Diabetes</text>
  </g>
</svg>
