<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1026">
        <animate attributeName="stop-color" values="#0b1026;#141a3d;#0b1026" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#1b1f4b"/>
      <stop offset="100%" stop-color="#2a1745">
        <animate attributeName="stop-color" values="#2a1745;#3b1f5c;#2a1745" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#9b8cff"/>
      <stop offset="100%" stop-color="#f15bb5"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>

  <style>
    .title { font-weight: 800; font-size: 50px; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; letter-spacing: 1px;
             animation: glow 4s ease-in-out infinite; }
    .sub   { font-weight: 600; font-size: 15px; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #d6d9ff; letter-spacing: 2px; }
    .org   { font-weight: 400; font-size: 15px; font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #9aa3d8; letter-spacing: 1px; }
    .edge  { stroke: #7f8cff; stroke-width: 1; opacity: .25; }
    .pulse { stroke: #00f5d4; stroke-width: 2; stroke-dasharray: 6 60; fill: none; animation: flow 2.4s linear infinite; }
    .node  { animation: blink 3s ease-in-out infinite; }
    .star  { fill: #fff; animation: twinkle 3s ease-in-out infinite; }
    .wave1 { animation: drift 10s linear infinite; }
    .wave2 { animation: drift 15s linear infinite reverse; }
    .rise  { fill: #9b8cff; animation: up 9s linear infinite; }
    .sweep { animation: sweep 9s ease-in-out infinite; }
    .uline { transform-box: fill-box; transform-origin: center; animation: grow 5s ease-in-out infinite; }
    @keyframes up    { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 100% { transform: translateY(-230px); opacity: 0; } }
    @keyframes sweep { 0%, 60% { transform: translateX(0); } 100% { transform: translateX(1600px); } }
    @keyframes grow  { 0%, 100% { transform: scaleX(.35); opacity: .6; } 50% { transform: scaleX(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    @keyframes glow    { 0%, 100% { opacity: 1; } 50% { opacity: .8; } }
    @keyframes flow    { from { stroke-dashoffset: 66; } to { stroke-dashoffset: 0; } }
    @keyframes blink   { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
    @keyframes drift   { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <!-- stars -->
    <circle class="star" cx="300" cy="28" r="1.5"/>
    <circle class="star" cx="420" cy="18" r="1.2" style="animation-delay:.6s"/>
    <circle class="star" cx="560" cy="30" r="1.7" style="animation-delay:1.2s"/>
    <circle class="star" cx="680" cy="16" r="1.1" style="animation-delay:.3s"/>
    <circle class="star" cx="500" cy="250" r="1.2" style="animation-delay:1.8s"/>

    <!-- neural network, left (3-4-2 layers) -->
    <g transform="translate(0 40) scale(.75)">
      <path class="edge" d="M40 70 L120 50 M40 70 L120 110 M40 70 L120 170 M40 70 L120 230
                             M40 150 L120 50 M40 150 L120 110 M40 150 L120 170 M40 150 L120 230
                             M40 230 L120 50 M40 230 L120 110 M40 230 L120 170 M40 230 L120 230
                             M120 50 L200 110 M120 110 L200 110 M120 170 L200 110 M120 230 L200 110
                             M120 50 L200 190 M120 110 L200 190 M120 170 L200 190 M120 230 L200 190"/>
      <path class="pulse" d="M40 70 L120 110 L200 190"/>
      <path class="pulse" d="M40 230 L120 170 L200 110" style="animation-delay:-.8s"/>
      <path class="pulse" d="M40 150 L120 50 L200 110" style="animation-delay:-1.6s"/>
      <g fill="#00f5d4">
        <circle class="node" cx="40" cy="70" r="7"/>
        <circle class="node" cx="40" cy="150" r="7" style="animation-delay:.5s"/>
        <circle class="node" cx="40" cy="230" r="7" style="animation-delay:1s"/>
      </g>
      <g fill="#9b8cff">
        <circle class="node" cx="120" cy="50" r="7" style="animation-delay:.3s"/>
        <circle class="node" cx="120" cy="110" r="7" style="animation-delay:.8s"/>
        <circle class="node" cx="120" cy="170" r="7" style="animation-delay:1.3s"/>
        <circle class="node" cx="120" cy="230" r="7" style="animation-delay:1.8s"/>
      </g>
      <g fill="#f15bb5">
        <circle class="node" cx="200" cy="110" r="7" style="animation-delay:.6s"/>
        <circle class="node" cx="200" cy="190" r="7" style="animation-delay:1.6s"/>
      </g>
    </g>

    <!-- neural network, right (mirrored) -->
    <g transform="translate(1000 40) scale(-.75 .75)">
      <path class="edge" d="M40 70 L120 50 M40 70 L120 110 M40 70 L120 170 M40 70 L120 230
                             M40 150 L120 50 M40 150 L120 110 M40 150 L120 170 M40 150 L120 230
                             M40 230 L120 50 M40 230 L120 110 M40 230 L120 170 M40 230 L120 230
                             M120 50 L200 110 M120 110 L200 110 M120 170 L200 110 M120 230 L200 110
                             M120 50 L200 190 M120 110 L200 190 M120 170 L200 190 M120 230 L200 190"/>
      <path class="pulse" d="M40 150 L120 170 L200 190" style="animation-delay:-.4s"/>
      <path class="pulse" d="M40 70 L120 230 L200 110" style="animation-delay:-1.2s"/>
      <path class="pulse" d="M40 230 L120 50 L200 190" style="animation-delay:-2s"/>
      <g fill="#f15bb5">
        <circle class="node" cx="40" cy="70" r="7" style="animation-delay:.2s"/>
        <circle class="node" cx="40" cy="150" r="7" style="animation-delay:.7s"/>
        <circle class="node" cx="40" cy="230" r="7" style="animation-delay:1.2s"/>
      </g>
      <g fill="#9b8cff">
        <circle class="node" cx="120" cy="50" r="7" style="animation-delay:.4s"/>
        <circle class="node" cx="120" cy="110" r="7" style="animation-delay:.9s"/>
        <circle class="node" cx="120" cy="170" r="7" style="animation-delay:1.4s"/>
        <circle class="node" cx="120" cy="230" r="7" style="animation-delay:1.9s"/>
      </g>
      <g fill="#00f5d4">
        <circle class="node" cx="200" cy="110" r="7" style="animation-delay:.1s"/>
        <circle class="node" cx="200" cy="190" r="7" style="animation-delay:1.1s"/>
      </g>
    </g>

    <!-- waves (2000 wide so they loop seamlessly) -->
    <g class="wave1" opacity=".3">
      <path fill="#9b8cff" d="M0 262 Q125 240 250 262 T500 262 T750 262 T1000 262 T1250 262 T1500 262 T1750 262 T2000 262 V300 H0 Z"/>
    </g>
    <g class="wave2" opacity=".3">
      <path fill="#00f5d4" d="M0 275 Q125 295 250 275 T500 275 T750 275 T1000 275 T1250 275 T1500 275 T1750 275 T2000 275 V300 H0 Z"/>
    </g>

    <!-- rising data particles -->
    <circle class="rise" cx="290" cy="270" r="2"/>
    <circle class="rise" cx="370" cy="270" r="1.5" style="animation-delay:-2s"/>
    <circle class="rise" cx="450" cy="270" r="2.2" style="animation-delay:-5s; fill:#00f5d4"/>
    <circle class="rise" cx="545" cy="270" r="1.6" style="animation-delay:-7s"/>
    <circle class="rise" cx="630" cy="270" r="2" style="animation-delay:-3.5s; fill:#f15bb5"/>
    <circle class="rise" cx="715" cy="270" r="1.5" style="animation-delay:-6s; fill:#00f5d4"/>

    <!-- soft diagonal light sweep -->
    <defs>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".5" stop-color="#fff" stop-opacity=".07"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <g class="sweep"><rect x="-320" y="-60" width="160" height="420" fill="url(#beam)" transform="skewX(-20)"/></g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 30;0 0" dur="1.2s" calcMode="spline" keySplines=".2 .8 .2 1" fill="freeze"/>
      <text class="title" x="500" y="120" text-anchor="middle" fill="url(#text)">Dr. Sulaxan Jadhav</text>
      <text class="sub" x="500" y="162" text-anchor="middle">ASSISTANT PROFESSOR · AI · DATA SCIENCE · CYBER SECURITY</text>
      <text class="org" x="500" y="196" text-anchor="middle">Symbiosis School of Economics, Symbiosis International University, Pune</text>
    </g>
  </g>
</svg>
