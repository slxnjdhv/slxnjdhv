<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1330"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#9b8cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9b8cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>

  <style>
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #9aa3d8; }
    .tiny  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9px; fill: #6f78b8; }
    .blink { animation: blink 1s steps(1) infinite; }
    .led   { animation: led 2.4s ease-in-out infinite; }
    .code  { transform-box: fill-box; transform-origin: left center; animation: code 8s ease-out infinite backwards; }
    .armA  { transform-box: fill-box; transform-origin: 50% 0; animation: tap .35s ease-in-out infinite alternate; }
    .armB  { transform-box: fill-box; transform-origin: 50% 0; animation: tap .35s ease-in-out .17s infinite alternate; }
    .head  { animation: nod 4s ease-in-out infinite; }
    .gear  { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
    .gear2 { transform-box: fill-box; transform-origin: center; animation: spin 4s linear infinite reverse; }
    .steam { animation: steam 3s ease-out infinite; }
    .chart { stroke-dasharray: 160; animation: draw 6s ease-in-out infinite; }
    .walk  { animation: walk 18s linear infinite; }
    .bob   { animation: bob .45s ease-in-out infinite alternate; }
    .legF, .armBk { transform-box: fill-box; transform-origin: 50% 0; animation: swing .9s ease-in-out infinite alternate; }
    .legB, .armFr { transform-box: fill-box; transform-origin: 50% 0; animation: swing .9s ease-in-out -.45s infinite alternate; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes led   { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes code  { 0% { transform: scaleX(0); } 8%, 88% { transform: scaleX(1); opacity: 1; } 96%, 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes tap   { from { transform: rotate(0deg); } to { transform: rotate(-6deg); } }
    @keyframes nod   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes steam { 0% { transform: translateY(0); opacity: 0; } 30% { opacity: .7; } 100% { transform: translateY(-16px); opacity: 0; } }
    @keyframes draw  { 0% { stroke-dashoffset: 160; } 45%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes walk  { from { transform: translateX(-230px); } to { transform: translateX(900px); } }
    @keyframes bob   { from { transform: translateY(0); } to { transform: translateY(-2px); } }
    @keyframes swing { from { transform: rotate(22deg); } to { transform: rotate(-22deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <ellipse cx="712" cy="115" rx="190" ry="105" fill="url(#glow)"/>

    <!-- caption -->
    <text class="mono" x="140" y="44">&gt; building AI for healthcare, security &amp; data<tspan class="blink" fill="#00f5d4"> ▍</tspan></text>

    <!-- floor -->
    <rect x="0" y="225" width="1000" height="35" fill="#0b0e24"/>
    <rect x="0" y="225" width="1000" height="1.5" fill="#3a4180" opacity=".7"/>

    <!-- server rack -->
    <g>
      <rect x="40" y="95" width="66" height="130" rx="6" fill="#151a3a" stroke="#3a4180"/>
      <rect x="48" y="105" width="50" height="22" rx="3" fill="#0b0f24"/>
      <rect x="48" y="133" width="50" height="22" rx="3" fill="#0b0f24"/>
      <rect x="48" y="161" width="50" height="22" rx="3" fill="#0b0f24"/>
      <rect x="48" y="189" width="50" height="22" rx="3" fill="#0b0f24"/>
      <g>
        <circle class="led" cx="56" cy="116" r="2.5" fill="#00f5d4"/>
        <circle class="led" cx="64" cy="116" r="2.5" fill="#9b8cff" style="animation-delay:-.6s"/>
        <circle class="led" cx="56" cy="144" r="2.5" fill="#00f5d4" style="animation-delay:-1.2s"/>
        <circle class="led" cx="64" cy="144" r="2.5" fill="#f15bb5" style="animation-delay:-.3s"/>
        <circle class="led" cx="56" cy="172" r="2.5" fill="#9b8cff" style="animation-delay:-1.8s"/>
        <circle class="led" cx="64" cy="172" r="2.5" fill="#00f5d4" style="animation-delay:-.9s"/>
        <circle class="led" cx="56" cy="200" r="2.5" fill="#00f5d4" style="animation-delay:-1.5s"/>
        <circle class="led" cx="64" cy="200" r="2.5" fill="#9b8cff" style="animation-delay:-2.1s"/>
      </g>
      <rect x="74" y="114" width="18" height="2" rx="1" fill="#3a4180"/>
      <rect x="74" y="142" width="18" height="2" rx="1" fill="#3a4180"/>
      <rect x="74" y="170" width="18" height="2" rx="1" fill="#3a4180"/>
      <rect x="74" y="198" width="18" height="2" rx="1" fill="#3a4180"/>
    </g>

    <!-- chair -->
    <rect x="512" y="134" width="7" height="56" rx="3" fill="#2b2f55"/>
    <rect x="514" y="186" width="48" height="6" rx="3" fill="#2b2f55"/>
    <rect x="536" y="192" width="4" height="26" fill="#2b2f55"/>
    <rect x="518" y="218" width="40" height="4" rx="2" fill="#2b2f55"/>

    <!-- desk -->
    <rect x="575" y="168" width="255" height="7" rx="3" fill="#3a4180"/>
    <rect x="588" y="175" width="6" height="50" fill="#2b2f55"/>
    <rect x="812" y="175" width="6" height="50" fill="#2b2f55"/>

    <!-- monitor -->
    <rect x="630" y="68" width="164" height="90" rx="7" fill="#0b0f24" stroke="#4b52a0" stroke-width="2"/>
    <rect x="706" y="158" width="12" height="8" fill="#4b52a0"/>
    <rect x="690" y="165" width="44" height="3" rx="1.5" fill="#4b52a0"/>
    <g>
      <rect class="code" x="642" y="80"  width="44"  height="5" rx="2.5" fill="#f15bb5"/>
      <rect class="code" x="690" y="80"  width="52"  height="5" rx="2.5" fill="#e6e8ff" opacity=".7" style="animation-delay:.3s"/>
      <rect class="code" x="652" y="92"  width="96"  height="5" rx="2.5" fill="#00f5d4" style="animation-delay:.7s"/>
      <rect class="code" x="652" y="104" width="62"  height="5" rx="2.5" fill="#9b8cff" style="animation-delay:1.1s"/>
      <rect class="code" x="662" y="116" width="104" height="5" rx="2.5" fill="#e6e8ff" opacity=".7" style="animation-delay:1.5s"/>
      <rect class="code" x="662" y="128" width="70"  height="5" rx="2.5" fill="#00f5d4" style="animation-delay:1.9s"/>
      <rect class="code" x="652" y="140" width="40"  height="5" rx="2.5" fill="#f15bb5" style="animation-delay:2.3s"/>
      <rect class="blink" x="696" y="139" width="3" height="7" fill="#00f5d4"/>
    </g>

    <!-- keyboard -->
    <rect x="580" y="163" width="44" height="5" rx="2" fill="#6f78b8"/>

    <!-- coffee -->
    <rect x="790" y="152" width="15" height="16" rx="3" fill="#f15bb5"/>
    <circle cx="807" cy="160" r="4.5" fill="none" stroke="#f15bb5" stroke-width="2.5"/>
    <path class="steam" d="M795 148 q-3 -5 0 -9 t0 -9" fill="none" stroke="#cfd3ff" stroke-width="1.6" stroke-linecap="round"/>
    <path class="steam" d="M801 148 q3 -5 0 -9 t0 -9" fill="none" stroke="#cfd3ff" stroke-width="1.6" stroke-linecap="round" style="animation-delay:-1.5s"/>

    <!-- gears -->
    <g class="gear"><circle cx="812" cy="52" r="13" fill="none" stroke="#9b8cff" stroke-width="6" stroke-dasharray="4.5 3.6"/><circle cx="812" cy="52" r="8" fill="none" stroke="#9b8cff" stroke-width="3"/></g>
    <g class="gear2"><circle cx="834" cy="72" r="8" fill="none" stroke="#00f5d4" stroke-width="5" stroke-dasharray="3.5 3"/><circle cx="834" cy="72" r="4" fill="none" stroke="#00f5d4" stroke-width="2"/></g>

    <!-- whiteboard with model accuracy chart -->
    <rect x="862" y="60" width="116" height="84" rx="6" fill="#151a3a" stroke="#3a4180"/>
    <rect x="886" y="144" width="3" height="81" fill="#2b2f55"/>
    <rect x="950" y="144" width="3" height="81" fill="#2b2f55"/>
    <text class="tiny" x="872" y="74">model accuracy</text>
    <path d="M874 82 V132 H968" fill="none" stroke="#3a4180" stroke-width="1.5"/>
    <path class="chart" d="M876 128 L894 118 L910 121 L926 104 L942 99 L962 86" fill="none" stroke="#00f5d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="962" cy="86" r="3" fill="#f15bb5"/>

    <!-- seated engineer (side view, facing the monitor) -->
    <g>
      <!-- back arm -->
      <g transform="rotate(-66 545 150)"><rect class="armB" x="541.5" y="150" width="7" height="38" rx="3.5" fill="#6a5bd6"/></g>
      <!-- legs -->
      <rect x="532" y="177" width="46" height="11" rx="5.5" fill="#2b2f55"/>
      <rect x="569" y="181" width="9" height="42" rx="4.5" fill="#2b2f55"/>
      <ellipse cx="579" cy="223" rx="9" ry="3.5" fill="#e6e8ff"/>
      <!-- torso -->
      <rect x="527" y="138" width="24" height="46" rx="9" fill="#9b8cff"/>
      <!-- head -->
      <g class="head">
        <rect x="535" y="128" width="8" height="10" fill="#c98a5b"/>
        <circle cx="541" cy="121" r="12" fill="#d79b6c"/>
        <path d="M528.5 121 A12.5 12.5 0 0 1 553 116 Q547 112 541 113.5 Q534 115 531 123 Z" fill="#1b1b2f"/>
        <rect x="546" y="118" width="9" height="5" rx="2" fill="none" stroke="#1b1b2f" stroke-width="1.5"/>
      </g>
      <!-- front arm -->
      <g transform="rotate(-62 541 148)"><rect class="armA" x="537.5" y="148" width="7" height="40" rx="3.5" fill="#b3a8ff"/></g>
    </g>

    <!-- walking engineer carrying a laptop -->
    <g transform="translate(160 0)">
      <g class="walk">
        <g class="bob">
          <rect class="legB" x="-4" y="186" width="8" height="38" rx="4" fill="#20244a"/>
          <rect class="armBk" x="-3" y="152" width="6" height="30" rx="3" fill="#00a88f"/>
          <rect class="legF" x="-4" y="186" width="8" height="38" rx="4" fill="#2b2f55"/>
          <rect x="-10" y="148" width="20" height="42" rx="8" fill="#00c9a7"/>
          <rect x="-3" y="140" width="6" height="9" fill="#c98a5b"/>
          <circle cx="0" cy="132" r="11" fill="#d79b6c"/>
          <path d="M-11.5 131 A11.5 11.5 0 0 1 11.5 131 Q8 126 2 126.5 Q-6 127 -11.5 131 Z" fill="#1b1b2f"/>
          <rect class="armFr" x="-3" y="152" width="6" height="30" rx="3" fill="#00e0bb"/>
          <rect x="-2" y="170" width="22" height="3" rx="1.5" fill="#cfd3ff" transform="rotate(-8 -2 170)"/>
        </g>
      </g>
    </g>
  </g>
</svg>
