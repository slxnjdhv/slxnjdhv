  <text class="ln" x="50" y="154.0" text-anchor="end">5</text>
  <text class="code" x="66" y="154.0" xml:space="preserve"><tspan fill="#e6e8ff">model</tspan><tspan fill="#9aa3d8"> = </tspan><tspan fill="#e6e8ff">nn.</tspan><tspan fill="#2ee6c8">Sequential</tspan><tspan fill="#9aa3d8">(</tspan></text>
