  <text class="code" x="66" y="76.0" xml:space="preserve"><tspan fill="#f472b6">import</tspan><tspan fill="#e6e8ff"> torch.nn </tspan><tspan fill="#f472b6">as</tspan><tspan fill="#e6e8ff"> nn</tspan></text>
