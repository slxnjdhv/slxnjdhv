  <text class="ln" x="50" y="193.0" text-anchor="end">7</text>
  <text class="code" x="66" y="193.0" xml:space="preserve"><tspan fill="#e6e8ff">    nn.</tspan><tspan fill="#2ee6c8">Dropout</tspan><tspan fill="#9aa3d8">(</tspan><tspan fill="#b8a9ff">0.2</tspan><tspan fill="#9aa3d8">),</tspan></text>
  <rect class="cover" x="64" y="179.0" width="167" height="19" fill="#0b0f24" style="animation: c6 15.0s linear infinite"/>
  <text class="ln" x="50" y="212.5" text-anchor="end">8</text>
