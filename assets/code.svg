  <text class="ln" x="50" y="271.0" text-anchor="end">11</text>
  <text class="code" x="66" y="271.0" xml:space="preserve"><tspan fill="#2ee6c8">train</tspan><tspan fill="#e6e8ff">(model, </tspan><tspan fill="#2ee6c8">load_data</tspan><tspan fill="#9aa3d8">(</tspan><tspan fill="#fcd581">&quot;clinical.csv&quot;</tspan><tspan fill="#e6e8ff">), epochs=</tspan><tspan fill="#b8a9ff">50</tspan><tspan fill="#9aa3d8">)</tspan></text>
  <rect class="cover" x="64" y="257.0" width="402" height="19" fill="#0b0f24" style="animation: c10 15.0s linear infinite"/>
  <text class="ln" x="50" y="290.5" text-anchor="end">12</text>
